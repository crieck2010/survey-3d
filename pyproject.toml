[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-3d"
version = "0.1.0"
description = "DSM/DEM differencing and cut/fill volumetrics engine for surveying and remote sensing: elevation-change rasters, per-zone cut/fill volumes, change polygons, and coregistration checks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["surveying", "remote-sensing", "dem", "dsm", "cut-fill", "volumetrics", "earthwork"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
]
# The engine core is stdlib+numpy on purpose. GeoTIFF I/O needs rasterio
# (lazy import — only the acquire module touches it).
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
raster = ["rasterio>=1.3"]
dev = ["build", "twine", "pytest"]

[project.scripts]
survey-3d = "elev3d.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/survey-3d"
Repository = "https://github.com/crieck2010/survey-3d"
Issues = "https://github.com/crieck2010/survey-3d/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
